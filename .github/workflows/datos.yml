name: Descargar datos
# Baja el dataset público Bank Marketing (UCI, CC BY 4.0) y lo guarda en data/raw.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bank Marketing (UCI)
        run: |
          mkdir -p data/raw tmp
          curl -sSL -o tmp/bank.zip https://archive.ics.uci.edu/static/public/222/bank+marketing.zip
          cd tmp && unzip -o -q bank.zip && ls -la && for z in *.zip; do unzip -o -q "$z"; done; find . -name "*.csv" -o -name "*.txt" | head -20
          cp bank-additional/bank-additional-full.csv bank-additional/bank-additional-names.txt ../data/raw/
          sha256sum ../data/raw/* | tee ../data/raw/SHA256SUMS
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet || git commit -m "Datos crudos: Bank Marketing (UCI, CC BY 4.0)"
          git push
