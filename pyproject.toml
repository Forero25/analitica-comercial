[project]
name = "analitica-comercial"
version = "0.1.0"
description = "Código de los ensayos de analítica comercial: lead scoring y tableros orientados a decisiones"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2", "pandas>=2.3", "scikit-learn>=1.7", "scipy>=1.15"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
